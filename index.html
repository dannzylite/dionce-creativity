<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#8b258f">
<meta name="description" content="Dionce Creativity — your stories, your readers, your world.">
<title>Dionce Creativity</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/dc-icon-512.png">
<link rel="apple-touch-icon" href="assets/dc-icon-180.png">
<style>
:root{--magenta:#ec2f82;--purple:#702b91;--plum:#44204e;--cream:#fffaf7;--ink:#2a2030;--muted:#817486;--line:#eee3ef;--shadow:0 12px 36px #47234c12}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #e76ab5;outline-offset:2px}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,4vw,54px);gap:14px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;color:var(--ink)}.brand img{height:42px;width:auto;border-radius:8px}.brand strong{font-family:Georgia,serif;font-size:18px;line-height:1.05}.brand strong span{display:block;color:var(--purple)}.topright{display:flex;gap:9px;align-items:center}.search{width:min(27vw,270px);border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:#fcf8fd}.btn{border:0;border-radius:10px;padding:11px 15px;background:linear-gradient(110deg,var(--magenta),var(--purple));color:white;font-size:13px;font-weight:750}.btn.secondary{background:#fff;color:var(--purple);border:1px solid #e7d5eb}.btn.small{padding:8px 11px}.iconbtn,.avatar{height:38px;width:38px;border-radius:50%;border:1px solid var(--line);background:white;color:var(--purple)}.avatar{background:linear-gradient(135deg,var(--magenta),var(--purple));color:#fff;border:0;font-weight:800}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);max-width:1500px;margin:auto}.sidebar{padding:25px 15px;background:white;border-right:1px solid var(--line);min-height:calc(100vh - 72px)}.navlabel{font-size:10px;letter-spacing:1.7px;color:#a296a7;font-weight:800;padding:10px 12px}.navbtn{width:100%;display:flex;gap:11px;align-items:center;text-align:left;border:0;background:none;color:#746579;padding:12px;border-radius:11px;margin-bottom:4px;font-size:13px}.navbtn.active{background:linear-gradient(100deg,#f8dfee,#f0e2f8);color:var(--purple);font-weight:800}.main{padding:clamp(18px,3vw,42px);min-width:0}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--purple);font-weight:800;text-transform:uppercase}.title{font-family:Georgia,serif;font-size:clamp(27px,3vw,37px);letter-spacing:-.8px;margin:8px 0}.sub{color:var(--muted);font-size:14px;line-height:1.65;margin:8px 0 25px}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center;background:linear-gradient(120deg,#fce5ef,#f4e5f7 65%,#e8d5f1);padding:clamp(23px,4vw,40px);border-radius:22px}.hero h1{font:clamp(32px,4vw,49px)/1.1 Georgia,serif;letter-spacing:-1.5px;margin:13px 0}.hero h1 em{color:var(--purple);font-weight:400}.hero p{font-size:14px;line-height:1.7;color:#76637d}.heroart{display:flex;gap:10px;align-items:center;justify-content:center}.heroart img{width:35%;max-width:145px;aspect-ratio:3/4;object-fit:cover;border-radius:8px;box-shadow:0 13px 25px #51234d30}.heroart img:first-child{transform:rotate(-8deg) translateY(10px)}.heroart img:last-child{transform:rotate(8deg) translateY(-10px)}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:29px 0 15px}.sectionhead h2{font:23px Georgia,serif;margin:0}.linkbtn{border:0;background:none;color:var(--purple);font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:17px}.book{border:0;background:none;text-align:left;padding:0;min-width:0;color:inherit}.cover{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:#eee;box-shadow:0 6px 15px #3e244012}.bookname{font:700 14px/1.3 Georgia,serif;margin:9px 0 5px}.meta{font-size:11px;color:var(--muted)}.continue{display:grid;grid-template-columns:95px 1fr;gap:16px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.continue .cover{max-width:95px}.progress{height:5px;background:#eee4f0;border-radius:9px;margin:11px 0;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--magenta),var(--purple))}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 13px;font-size:12px;color:#75677c}.chip.active{background:var(--purple);border-color:var(--purple);color:white}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:var(--shadow)}.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;margin:5px 0 12px}.fieldlabel{font-size:12px;font-weight:750}.readerlayout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}.paper{background:white;border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,46px)}.readertext{font:19px/1.95 Georgia,serif;color:#3c3041}.readertext p{margin:0 0 22px}.passage{background:#fbddeb;cursor:pointer;border-radius:3px}.comment{padding:13px 0;border-top:1px solid var(--line);font-size:12px;line-height:1.6}.comment p{margin:5px 0;color:#55485b}.row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}.row img{width:52px;flex-shrink:0}.grow{flex:1;min-width:0}.badge{display:inline-block;background:#f7e7f5;color:#7b3485;padding:5px 8px;border-radius:999px;font-size:10px}.empty{padding:28px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #e4d5e8;border-radius:14px}.notice{padding:12px 14px;background:#fff5db;color:#73521a;border-radius:10px;font-size:12px;line-height:1.6;margin-bottom:16px}.hide{display:none!important}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#35203e;color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;z-index:20;max-width:90vw}.bottomnav{display:none}
@media(max-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.layout{grid-template-columns:180px minmax(0,1fr)}.readerlayout{grid-template-columns:minmax(0,1fr) 250px}}
@media(max-width:720px){.topbar{height:64px;padding:0 12px}.brand img{height:35px;width:auto}.brand strong{font-size:15px}.search{width:115px;font-size:12px;padding:9px}.layout{display:block}.sidebar{display:none}.main{padding:18px 14px 86px}.hero{grid-template-columns:1fr;padding:23px;gap:10px}.hero h1{font-size:35px}.heroart img{max-width:105px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.readerlayout{grid-template-columns:1fr}.paper{padding:20px}.readertext{font-size:18px}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:10}.bottomnav button{border:0;background:none;color:#817187;font-size:10px;display:flex;flex-direction:column;gap:3px;align-items:center}.bottomnav button span{font-size:18px}.bottomnav button.active{color:var(--purple);font-weight:800}.sectionhead h2{font-size:21px}}
@media(max-width:390px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.search{width:90px}.hero h1{font-size:31px}}

/* Passage highlights and inline comments */
.readertext p{white-space:pre-wrap}mark.hl{background:#fbe0ef;color:inherit;border-bottom:2px solid #ec2f8277;border-radius:2px;cursor:pointer}mark.hl.draft{background:#e8d6f6;border-bottom-color:var(--purple)}mark.hl.flash{background:#f6b3d6;transition:background .3s}.hlfab{position:absolute;z-index:15;border:0;border-radius:999px;padding:9px 15px;background:linear-gradient(110deg,var(--magenta),var(--purple));color:#fff;font-size:13px;font-weight:750;box-shadow:0 8px 22px #47234c44;white-space:nowrap}.hlfab:disabled{background:#6f6175;cursor:default}.quote{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--magenta);background:#fdf3f8;padding:6px 9px;margin:6px 0;font:italic 12px/1.5 Georgia,serif;color:#6b4d72;border-radius:4px;cursor:pointer}@media(min-width:721px){#comments{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto}}
/* Account menu under the profile picture */
.acct{position:relative}.menu{position:absolute;right:0;top:46px;min-width:210px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px #47234c26;padding:6px;z-index:30}.menu .who{padding:8px 12px 10px;margin-bottom:4px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);overflow-wrap:anywhere}.menu .who b{color:var(--ink);font-size:13px}.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;font-size:13px;color:var(--ink)}.menu button:hover,.menu button:focus-visible{background:#f8eef9}
.stats{display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:11px}.stats span{display:inline-flex;gap:4px;align-items:center}.stats svg{flex:none}
.users{width:100%;border-collapse:collapse;font-size:13px}.users th{text-align:left;font-size:11px;font-weight:750;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.users td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}.users tr:last-child td{border-bottom:0}
</style>
</head>
<body>
<header class="topbar">
<button class="brand" data-page="Home"><img src="assets/dc-logo.jpg" alt="Dionce Creativity logo"><strong>Dionce <span>Creativity</span></strong></button>
<div class="topright"><input id="search" class="search" placeholder="Search stories…" aria-label="Search stories"><button class="iconbtn" data-page="Updates" aria-label="Updates">♧</button><div class="acct"><button class="avatar" id="avatar-btn" aria-label="Account" aria-haspopup="menu" aria-expanded="false">D</button><div id="account-menu" class="menu hide" role="menu"></div></div></div>
</header>
<div class="layout"><aside class="sidebar"><div class="navlabel">YOUR READING SPACE</div>
<button class="navbtn active" data-page="Home">⌂ &nbsp; Home</button><button class="navbtn" data-page="Library">▤ &nbsp; Library</button><button class="navbtn" data-page="Community">♡ &nbsp; Community</button><button class="navbtn" data-page="Updates">♧ &nbsp; Updates</button><button class="navbtn" data-page="Profile">♙ &nbsp; My Profile</button><button class="navbtn hide" data-page="Admin">⚙ &nbsp; Author dashboard</button>
</aside><main class="main" id="main"></main></div>
<nav class="bottomnav"><button data-page="Home" class="active"><span>⌂</span>Home</button><button data-page="Library"><span>▤</span>Library</button><button data-page="Community"><span>♡</span>Community</button><button data-page="Updates"><span>♧</span>Updates</button><button data-page="Profile"><span>♙</span>Profile</button></nav>
<button id="hl-fab" class="hlfab hide" type="button">💬 Comment</button>
<div id="toast" class="toast hide" role="status"></div>
<script type="module" src="app.js"></script>
</body></html>
